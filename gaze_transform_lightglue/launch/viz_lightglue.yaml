launch:


# realsense2 launch params
- arg:
    name: "enable_rgbd"
    default: "true"
- arg:
    name: "enable_sync"
    default: "true"
- arg:
    name: "align_depth.enable"
    default: "true"
- arg:
    name: "enable_color"
    default: "true"
- arg:
    name: "enable_depth"
    default: "true"

# include realsense launch file
- group:
    - include:
        file: "$(find-pkg-share realsense2_camera)/launch/rs_launch.py"

- node:
    pkg: "pupil_labs_glasses"
    exec: "pupil_labs_stream_node"
    name: "pupil_labs_glasses"
    namespace: "smart_glasses"

- node:
    pkg: "gaze_transform_lightglue"
    exec: "gaze_transform_node"
    name: "gaze_transform"
    namespace: ""

- node:
    pkg: "gaze_transform"
    exec: "gaze_viz_node"
    name: "gaze_viz"
    namespace: ""